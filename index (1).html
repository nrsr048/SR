<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tez tibbiy yordam (103), yong'in xavfsizligi (101) va ichki ishlar (102) xizmatlari haqida bolalar uchun interaktiv o'yin.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%A8%3C/text%3E%3C/svg%3E">
<title>Shoshilinch xizmatlar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full-screen city scene. Header with 4 game modes, a row of round picture tokens in the sky, three service buildings as targets, a road with moving vehicles at the bottom. Day/night switch repaints sky and lights windows. Built to be shown large on a TV. */
:root{
  --sky1:#6ec1ff; --sky2:#dff3ff; --hill1:#74d29a; --hill2:#4db577; --road:#3e4a5d; --ink:#10304a;
  --glass:rgba(255,255,255,.82); --glassb:#ffffff; --win:#bfe3ff;
  --med:#ff5d73; --fire:#ff9f1c; --pol:#3b82f6; --ok:#1fae6c; --bad:#e5484d; --line:rgba(16,48,74,.18);
  --fd:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --fb:"Nunito",system-ui,sans-serif;
  --tok:clamp(72px,min(13vh,9vw),170px);
  color-scheme:light;
}
body[data-time="night"]{
  --sky1:#070f33; --sky2:#2a3a86; --hill1:#1f6b55; --hill2:#15483f; --road:#1a202c; --ink:#eaf2ff;
  --glass:rgba(14,22,58,.78); --glassb:#18235a; --win:#ffd666; --line:rgba(234,242,255,.22);
}
*{box-sizing:border-box}
body{margin:0;background:var(--sky2);color:var(--ink);font-family:var(--fb);font-weight:700;font-size:clamp(15px,1.15vw,24px);
  user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #ffd23f;outline-offset:2px}
.app{min-height:100dvh;display:flex;flex-direction:column;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
/* header */
.top{position:relative;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:.6em 1.2em;justify-content:space-between;
  padding:.6em max(16px,env(safe-area-inset-left,0px)) .6em max(16px,env(safe-area-inset-right,0px));background:var(--glass);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.logo{font-size:2.2em;line-height:1;animation:blink 1s steps(2) infinite}
.brand h1{font-family:var(--fd);font-weight:800;font-size:1.7em;line-height:1;margin:0}
.brand p{margin:.1em 0 0;font-size:.9em;opacity:.75;letter-spacing:.08em}
.modes{display:flex;flex-wrap:wrap;gap:.4em}
.modes button{border:2px solid var(--line);background:var(--glassb);border-radius:999px;padding:.45em 1em;font-weight:800;font-size:1.02em}
.modes button[aria-selected="true"]{background:var(--ink);color:var(--glassb);border-color:var(--ink)}
.ctl{display:flex;gap:.4em;flex-wrap:wrap}
.ctl button{width:2.6em;height:2.6em;border-radius:50%;border:2px solid var(--line);background:var(--glassb);font-size:1.1em;line-height:1;padding:0}
.ctl button[aria-pressed="false"]{opacity:.5}
/* scene */
.scene{position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;min-height:560px}
.sky{position:absolute;inset:0;z-index:-5;transition:opacity 1.2s}
.sky.d{background:linear-gradient(180deg,#5db6ff 0%,#bfe6ff 62%,#fff4cf 100%)}
.sky.n{background:linear-gradient(180deg,#050b26 0%,#1d2a6b 60%,#5a4b8f 100%);opacity:0}
body[data-time="night"] .sky.n{opacity:1}
body[data-time="night"] .sky.d{opacity:0}
.sun,.moon{position:absolute;z-index:-4;top:7%;right:9%;width:clamp(60px,8vw,150px);aspect-ratio:1;border-radius:50%;transition:opacity 1s,transform 1.4s}
.sun{background:radial-gradient(circle,#fffbd0 0 38%,#ffd84a 40% 62%,rgba(255,216,74,0) 72%);box-shadow:0 0 6vw 2vw rgba(255,224,102,.55);animation:spin 40s linear infinite}
.moon{background:#fdf6d8;box-shadow:inset -1.6vw -.6vw 0 0 #e1d7a8,0 0 4vw 1vw rgba(255,248,200,.35);opacity:0;transform:translateY(40px)}
body[data-time="night"] .sun{opacity:0;transform:translateY(60px)}
body[data-time="night"] .moon{opacity:1;transform:none}
.stars{position:absolute;inset:0 0 40% 0;z-index:-4;opacity:0;transition:opacity 1.2s}
body[data-time="night"] .stars{opacity:1}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
.cloud{position:absolute;z-index:-3;width:14vw;min-width:90px;height:3.4vw;min-height:22px;background:#fff;border-radius:99px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:42%;height:170%;left:14%;bottom:30%}
.cloud::after{width:34%;height:130%;right:16%;bottom:35%}
body[data-time="night"] .cloud{background:#7482c4;opacity:.35}
body[data-time="night"] .cloud::before,body[data-time="night"] .cloud::after{background:#7482c4}
.hills{position:absolute;left:0;right:0;bottom:6vh;height:46%;z-index:-2;width:100%}
.hills .h1{fill:var(--hill1)} .hills .h2{fill:var(--hill2)}
.trees{position:absolute;left:0;right:0;bottom:7vh;z-index:-1;display:flex;justify-content:space-around;font-size:clamp(28px,4vw,76px);pointer-events:none;opacity:.95}
body[data-time="night"] .trees{filter:brightness(.55)}
/* play area */
.play{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;gap:1.2vh;padding:1.2vh max(16px,1.5vw) 0;min-height:0}
.hud{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center}
.pill{background:var(--glass);border:2px solid var(--line);border-radius:999px;padding:.25em .9em;font-weight:800;white-space:nowrap}
.pill b{font-family:var(--fd);font-size:1.25em}
.prompt{text-align:center}
.prompt .pp{display:inline-block;max-width:100%;background:var(--glass);border:2px solid var(--line);border-radius:1.2em;padding:.35em 1.1em}
.prompt h2{font-family:var(--fd);font-weight:800;font-size:clamp(19px,2.6vw,50px);line-height:1.1;margin:0;text-wrap:balance}
.prompt p{margin:.1em 0 0;font-size:1em;opacity:.8}
.prompt .ask{margin-top:.5em;border:0;border-radius:999px;background:var(--ok);color:#fff;font-weight:800;font-size:1.3em;padding:.4em 1.3em;box-shadow:0 .2em 0 rgba(0,0,0,.25)}
.scn{display:inline-flex;align-items:center;gap:.8em;background:var(--glass);border:3px solid var(--ink);border-radius:1.4em;padding:.5em 1.2em;max-width:100%;text-align:left;animation:pop .4s}
.scn .big{font-size:clamp(44px,7vw,130px);line-height:1}
.scn .tx{font-family:var(--fd);font-weight:800;font-size:clamp(18px,2.4vw,46px);line-height:1.1;text-wrap:balance}
.toast{min-height:1.6em;text-align:center;font-weight:800;font-size:1.15em;text-shadow:0 1px 0 var(--glass)}
.toast span{display:inline-block;background:var(--glass);border-radius:999px;padding:.1em .9em}
.toast.bad span{color:var(--bad)} .toast.good span{color:var(--ok)}
.toast:empty{visibility:hidden}
/* tokens */
.tray{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:1.4vh 1.6vw;min-height:calc(var(--tok)*1.5)}
.tray:empty{min-height:0}
.tray.explore{--tok:clamp(58px,min(9.8vh,7vw),122px)}
.tok{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:.35em;width:calc(var(--tok)*1.3);touch-action:none;cursor:grab;
  animation:bob 3.4s ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .3s,opacity .35s}
.tok .disc{width:var(--tok);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glassb);border:.2em solid #fff;
  box-shadow:0 .35em 0 rgba(0,0,0,.2),0 .9em 1.6em rgba(0,0,0,.2);font-size:calc(var(--tok)*.5);line-height:1;transition:transform .2s,box-shadow .2s}
body[data-time="night"] .tok .disc{border-color:#9db0ff}
.tok .nm{background:var(--glass);border-radius:.8em;padding:.1em .6em;font-size:max(12px,calc(var(--tok)*.14));line-height:1.1;text-align:center;font-weight:800}
.tok:hover .disc{transform:scale(1.08)}
.tok.sel .disc{border-color:#ffd23f;transform:scale(1.14);box-shadow:0 0 0 .22em rgba(255,210,63,.55),0 1em 1.6em rgba(0,0,0,.25)}
.tok.seen .disc::after{content:"✓";position:absolute;top:0;right:calc(50% - var(--tok)/2 - .1em);width:1.5em;height:1.5em;border-radius:50%;background:var(--ok);color:#fff;font-size:calc(var(--tok)*.2);display:flex;align-items:center;justify-content:center;font-family:var(--fb)}
.tok.done{opacity:0;pointer-events:none;transform:scale(.3)}
.tok.right .disc{background:#c9f7de;border-color:var(--ok);animation:pulse .6s}
.tok.shake{animation:shake .45s}
.ghost{position:fixed;z-index:80;pointer-events:none;font-size:clamp(60px,9vw,130px);line-height:1;transform:translate(-50%,-60%) rotate(-6deg) scale(1.1);filter:drop-shadow(0 .4em .3em rgba(0,0,0,.35))}
/* buildings */
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4vw;align-items:end;margin-top:auto;padding-top:1vh;max-width:1500px;width:100%;align-self:center}
.bin{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;transition:transform .2s,filter .2s;min-width:0}
.bin svg{width:100%;max-height:34vh;min-height:90px;display:block;filter:drop-shadow(0 .5em .5em rgba(0,0,0,.25))}
.bin svg text{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.bin .w{fill:var(--win);stroke:#8fa8bd;stroke-width:2;transition:fill 1s}
.bin:hover{transform:translateY(-.3em)}
.bin.over{transform:translateY(-.5em) scale(1.05);filter:drop-shadow(0 0 1.2em #ffd23f)}
.bin.pulse{animation:pulse .6s} .bin.shake{animation:shake .45s}
.plate{margin-top:-.4em;display:flex;align-items:center;gap:.5em;background:var(--glassb);border:.18em solid var(--c);border-radius:1em;padding:.15em .7em .15em .2em;box-shadow:0 .25em 0 rgba(0,0,0,.2);max-width:100%}
.plate b{font-family:var(--fd);font-size:clamp(20px,2.6vw,52px);line-height:1;background:var(--c);color:#fff;border-radius:.7em;padding:.05em .45em}
.plate span{font-weight:800;font-size:clamp(12px,1.5vw,30px);line-height:1.05;text-align:left}
.bin[data-cat="med"]{--c:var(--med)} .bin[data-cat="fire"]{--c:var(--fire)} .bin[data-cat="pol"]{--c:var(--pol)}
.mini{display:flex;flex-wrap:wrap;gap:.1em;justify-content:center;min-height:1.6em;font-size:clamp(16px,2vw,36px);line-height:1;margin-top:.2em}
/* road */
.road{position:relative;height:clamp(52px,9vh,110px);background:var(--road);z-index:1;overflow:hidden;margin-top:.6vh;border-top:.3em solid #8a97a8}
.road::before{content:"";position:absolute;left:0;right:0;top:55%;height:.3em;background:repeating-linear-gradient(90deg,#f7e27a 0 4em,transparent 4em 8em)}
.car{position:absolute;bottom:18%;font-size:clamp(34px,5.5vh,84px);line-height:1;left:0;animation:cruise linear infinite;will-change:transform}
/* lesson card */
.ov{position:fixed;inset:0;z-index:90;background:rgba(6,18,40,.62);display:none;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ov.on{display:flex}
.card{width:min(620px,100%,92vw);max-height:100%;overflow:auto;background:var(--glassb);color:var(--ink);border:4px solid var(--ink);border-radius:1.6em;padding:1em;text-align:center;animation:pop .35s;box-shadow:0 .4em 0 var(--ink)}
@media(min-width:1500px){.card{width:min(860px,60vw)}}
.stage{position:relative;height:clamp(130px,24vh,280px);border-radius:1.1em;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage.med{background:linear-gradient(180deg,#ff9aa9,#ff5d73)} .stage.fire{background:linear-gradient(180deg,#ffd27a,#ff9f1c)} .stage.pol{background:linear-gradient(180deg,#8bb6ff,#3b82f6)}
.stage .em{font-size:clamp(70px,13vh,170px);line-height:1;position:relative;z-index:2}
.stage .wv{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;border:.35em solid rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:0}
.stage.playing .wv{animation:wave 1.5s ease-out infinite}
.stage.playing .wv:nth-child(2){animation-delay:.5s} .stage.playing .wv:nth-child(3){animation-delay:1s}
.stage .lamp{position:absolute;top:.3em;font-size:2em;animation:blink .5s steps(2) infinite}
.stage .lamp.l{left:.4em} .stage .lamp.r{right:.4em;animation-delay:.25s}
.stage .rd{position:absolute;left:0;right:0;bottom:0;height:.7em;background:rgba(0,0,0,.3)}
.a-drive{position:absolute!important;bottom:.5em;left:0;animation:drive 3s linear infinite}
.a-beat{animation:beat .8s ease-in-out infinite} .a-bounce{animation:bounce .7s ease-in-out infinite}
.a-fly{animation:fly 2.6s ease-in-out infinite} .a-shake{animation:wob .25s linear infinite}
.a-sway{animation:sway 1.2s ease-in-out infinite;transform-origin:50% 100%} .a-ring{animation:ring .18s linear infinite}
.a-blink{animation:pulse .9s ease-in-out infinite}
.say{font-family:var(--fd);font-weight:800;font-size:clamp(24px,3.4vw,60px);line-height:1.1;margin:.3em 0 0;color:var(--ink);min-height:1.2em}
.say.show{animation:pop .4s}
.card h2{font-family:var(--fd);font-weight:800;font-size:clamp(22px,2.4vw,46px);margin:.2em 0 .1em;line-height:1.1}
.badge{display:inline-block;font-weight:800;border-radius:999px;padding:.1em .9em;color:#fff;background:var(--b)}
.badge.med{--b:var(--med)} .badge.fire{--b:#e08400} .badge.pol{--b:var(--pol)}
.card p{margin:.5em 0 .8em;font-size:clamp(16px,1.6vw,30px);line-height:1.35}
.row{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap}
.card button{border:3px solid var(--ink);background:var(--glassb);border-radius:999px;padding:.4em 1em;font-weight:800;font-size:1.05em}
.card button.go{background:var(--ok);color:#fff;border-color:var(--ok)}
.end .stats{display:flex;gap:.8em;justify-content:center;margin:.6em 0;flex-wrap:wrap}
.end .stats div{background:var(--sky2);color:#10304a;border-radius:1em;padding:.4em 1.2em;font-size:1em}
.end .stats b{display:block;font-family:var(--fd);font-size:2em;line-height:1.1}
.stars3{font-size:2.6em;letter-spacing:.1em}
.confetti{position:fixed;top:-30px;font-size:clamp(24px,3vw,50px);z-index:95;pointer-events:none;animation:fall 3.2s linear forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5em)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
@keyframes cruise{from{transform:translateX(105vw)}to{transform:translateX(-12vw)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes blink{0%{opacity:1}100%{opacity:.2}}
@keyframes wave{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
@keyframes drive{0%{transform:translateX(-120px)}100%{transform:translateX(620px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
@keyframes fly{0%,100%{transform:translate(-110px,8px)}50%{transform:translate(110px,-14px)}}
@keyframes wob{0%,100%{transform:translateX(-4px) rotate(-4deg)}50%{transform:translateX(4px) rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes ring{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media(max-width:700px){.plate{flex-direction:column;gap:.15em;padding:.2em .4em;text-align:center}.plate span{font-size:11px;text-align:center}.plate b{font-size:20px}.brand h1{font-size:1.25em}.brand p{display:none}.scene{min-height:0}.bin svg{max-height:22vh}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">🚨</span><div><h1>Shoshilinch xizmatlar olami</h1><p>101 · 102 · 103</p></div></div>
    <nav class="modes" id="modes" aria-label="O'yin turlari">
      <button type="button" data-m="explore" aria-selected="true">🔎 Tanishuv</button>
      <button type="button" data-m="sort" aria-selected="false">🧩 Saralash</button>
      <button type="button" data-m="sound" aria-selected="false">👂 Ovozni top</button>
      <button type="button" data-m="number" aria-selected="false">📞 Qaysi raqam?</button>
    </nav>
    <div class="ctl">
      <button type="button" id="bSound" aria-pressed="true" title="Ovoz">🔊</button>
      <button type="button" id="bMusic" aria-pressed="false" title="Musiqa">🎵</button>
      <button type="button" id="bTime" title="Kun / tun">🌙</button>
      <button type="button" id="bFull" title="To'liq ekran">⛶</button>
      <button type="button" id="bReset" title="Qayta boshlash">↻</button>
    </div>
  </header>

  <main class="scene" id="scene">
    <div class="sky d"></div><div class="sky n"></div>
    <div class="sun"></div><div class="moon"></div><div class="stars" id="stars"></div>
    <div class="cloud" style="top:9%;animation-duration:70s;animation-delay:-20s"></div>
    <div class="cloud" style="top:20%;animation-duration:95s;animation-delay:-60s;transform:scale(.7)"></div>
    <div class="cloud" style="top:5%;animation-duration:120s;animation-delay:-90s;transform:scale(1.2)"></div>
    <svg class="hills" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">
      <path class="h2" d="M0 120 C120 60 260 140 420 90 S720 40 1000 110 L1000 200 L0 200Z"/>
      <path class="h1" d="M0 160 C160 100 300 170 520 130 S850 90 1000 150 L1000 200 L0 200Z"/>
    </svg>
    <div class="trees" aria-hidden="true"><span>🌳</span><span>🌲</span><span>🌳</span><span>🌴</span><span>🌲</span><span>🌳</span></div>

    <section class="play">
      <div class="hud">
        <span class="pill">⭐ <b id="hScore">0</b></span>
        <span class="pill" id="hStage">Tanishuv</span>
        <span class="pill">⏱ <b id="hTime">0:00</b></span>
      </div>
      <div class="prompt" id="prompt"></div>
      <div class="tray" id="tray"></div>
      <div class="toast" id="toast" role="status"></div>
      <div class="bins" id="bins"></div>
    </section>

    <div class="road" aria-hidden="true">
      <span class="car" style="animation-duration:15s;animation-delay:-3s">🚑</span>
      <span class="car" style="animation-duration:22s;animation-delay:-14s">🚒</span>
      <span class="car" style="animation-duration:18s;animation-delay:-9s">🚓</span>
      <span class="car" style="animation-duration:28s;animation-delay:-20s">🚌</span>
      <span class="car" style="animation-duration:12s;animation-delay:-6s">🚕</span>
    </div>
  </main>
</div>

<div class="ov" id="ov"><div class="card" id="card"></div></div>

<script>
const CATS={
  med:{name:"Tez tibbiy yordam",short:"Tez yordam",num:"103",ic:"🚑",snd:"ambulance"},
  fire:{name:"Yong'in xavfsizligi",short:"O't o'chirish",num:"101",ic:"🚒",snd:"firetruck"},
  pol:{name:"Ichki ishlar",short:"Militsiya",num:"102",ic:"🚓",snd:"police"}
};

function playSnd(id){if(!S.soundOn||!SND[id])return 0;if(!A())return 0;stopSfx();const b=AC.createGain();b.connect(master);b.connect(revSend);live.push(b);return SND[id](b,AC.currentTime+.04)}
function chime(){if(!S.soundOn||!A())return;const b=AC.createGain();b.connect(master);[660,880,1100].forEach((f,i)=>osc(b,"triangle",f,f,AC.currentTime+i*.09,.2,.25,.01))}
function buzz(){if(!S.soundOn||!A())return;const b=AC.createGain();b.connect(master);osc(b,"sawtooth",170,110,AC.currentTime,.3,.14,.01)}
/* background music */
const MEL=[392,440,523,659,523,440,392,330,392,440,523,587,523,440,392,330];let mi=0,musicT=null;
function music(){clearInterval(musicT);if(!S.musicOn)return;musicT=setInterval(()=>{if(!A())return;const b=AC.createGain();b.connect(master);osc(b,"triangle",MEL[mi++%MEL.length],MEL[(mi-1)%MEL.length],AC.currentTime,.34,.05,.02)},380)}
/* speech (Uzbek or similar voice if the device has one) */
let voices=[];function loadV(){try{voices=speechSynthesis.getVoices()}catch(e){}}
try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
const pickV=()=>voices.find(v=>/^uz/i.test(v.lang))||voices.find(v=>/^tr/i.test(v.lang));
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
function speak(txt,cb){let fired=false;const go=()=>{if(!fired){fired=true;cb&&cb()}};
  if(!S.soundOn){go();return}
  try{const v=pickV();if(!v){go();return}stopSpeech();const u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang=v.lang;u.rate=.85;u.onend=go;u.onerror=go;speechSynthesis.speak(u);setTimeout(go,Math.min(9000,1500+txt.length*95))}catch(e){go()}}

/* ===== scene setup ===== */
(function(){const st=$("#stars");for(let i=0;i<70;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=(Math.random()*2.4).toFixed(2)+"s";const z=1+Math.random()*2.5;s.style.width=s.style.height=z+"px";st.appendChild(s)}})();
Object.keys(CATS).forEach(k=>{const c=CATS[k],b=document.createElement("button");b.type="button";b.className="bin";b.dataset.cat=k;b.setAttribute("aria-label",c.name+" "+c.num);
  b.innerHTML=BUILD[k]+`<div class="plate"><b>${c.num}</b><span>${c.name}</span></div><div class="mini"></div>`;binsEl.appendChild(b)});
function setTime(t){document.body.dataset.time=t;$("#bTime").textContent=t==="night"?"☀️":"🌙";store.set("sx-time",t)}
setTime(store.get("sx-time")==="night"?"night":"day");
$("#bTime").onclick=()=>setTime(document.body.dataset.time==="night"?"day":"night");

/* ===== hud / timer ===== */
function hud(score,stage){if(score!=null)$("#hScore").textContent=score;if(stage!=null)$("#hStage").textContent=stage}
function tick(){const s=Math.floor((Date.now()-S.t0)/1000);$("#hTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function begin(){if(!S.t0){S.t0=Date.now();S.timer=setInterval(tick,500)}}
function say(msg,kind){toast.className="toast "+(kind||"");toast.innerHTML=msg?`<span>${msg}</span>`:""}
function clearMinis(){$$(".mini").forEach(m=>m.textContent="")}
function tok(it,i,showName=true){const b=document.createElement("button");b.type="button";b.className="tok";b.dataset.id=it.id;b.style.setProperty("--d",(i*-.37).toFixed(2)+"s");b.setAttribute("aria-label",it.n);
  b.innerHTML=`<span class="disc">${it.e}</span>${showName?`<span class="nm">${it.n}</span>`:""}`;return b}
const byId=id=>ITEMS.find(x=>x.id===id);

/* ===== lesson card ===== */
let ctimers=[],onCloseCb=null;
function stopTimers(){ctimers.forEach(clearTimeout);ctimers=[]}
function closeCard(){stopTimers();stopSfx();stopSpeech();ov.classList.remove("on");S.busy=false;const f=onCloseCb;onCloseCb=null;if(f)f()}
function showPanel(html,bind){stopTimers();card.className="card end";card.innerHTML=html;ov.classList.add("on");S.busy=true;bind&&bind()}
function openCard(it,o={}){
  stopTimers();stopSpeech();const c=CATS[it.c];S.busy=true;onCloseCb=o.onClose||null;
  card.className="card";
  card.innerHTML=`<div class="stage ${it.c}" id="stg"><i class="wv"></i><i class="wv"></i><i class="wv"></i><span class="lamp l">🚨</span><span class="lamp r">🚨</span><span class="em a-${it.anim}">${it.e}</span><span class="rd"></span></div>
  <div class="say" id="saybox">${it.say||""}</div>
  <h2>${it.n}</h2><span class="badge ${it.c}">${c.ic} ${c.name} · ${c.num}</span><p>${it.t}</p>
  <div class="row"><button type="button" id="bSnd">🔊 Ovozini eshitish</button><button type="button" id="bRead">🗣 O'qib berish</button><button type="button" class="go" id="bOk">${o.label||"Davom etish ▶"}</button></div>`;
  ov.classList.add("on");
  const stg=$("#stg"),sb=$("#saybox");
  const play=()=>{const d=playSnd(it.id);stg.classList.add("playing");sb.classList.remove("show");void sb.offsetWidth;sb.classList.add("show");stopTimers();ctimers.push(setTimeout(()=>stg.classList.remove("playing"),Math.max(1200,d*1000)));return d};
  $("#bSnd").onclick=()=>{stopSpeech();play()};
  $("#bRead").onclick=()=>{stopSfx();stg.classList.remove("playing");speak(it.n+". "+it.t)};
  $("#bOk").onclick=closeCard;
  ctimers.push(setTimeout(()=>{const d=play();if(!o.quiet)ctimers.push(setTimeout(()=>speak(it.n+". "+it.t),d*1000+250))},300));
  setTimeout(()=>$("#bOk")&&$("#bOk").focus(),50);
}
ov.addEventListener("click",e=>{if(e.target===ov&&$("#bOk"))closeCard()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ov.classList.contains("on")&&$("#bOk"))closeCard()});

/* ===== finish + confetti ===== */
function confetti(){for(let i=0;i<26;i++){const s=document.createElement("span");s.className="confetti";s.textContent=["🎉","⭐","🎈","🚒","🚑","🚓","🌟"][i%7];s.style.left=Math.random()*100+"vw";s.style.animationDelay=(Math.random()*1.4).toFixed(2)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}}
const ORDER=["explore","sort","sound","number"];
function finish(){
  clearInterval(S.timer);if(S.t0)tick();S.fin=true;
  const ex=S.mode==="explore",pct=S.total?S.first/S.total:1,st=pct>=.85?3:pct>=.6?2:1;
  const next=ORDER[(ORDER.indexOf(S.mode)+1)%4],nn={explore:"Tanishuv",sort:"Saralash",sound:"Ovozni top",number:"Qaysi raqam?"}[next];
  showPanel(`<div class="stage med" style="height:clamp(100px,18vh,200px)"><span class="em a-bounce">🏆</span></div>
   <h2>${ex?"Hammasini kashf etdingiz!":"Barakalla!"}</h2>
   <div class="stars3">${"⭐".repeat(ex?3:st)}</div>
   <div class="stats">${ex?"":`<div><b>${S.first}/${S.total}</b>Baho</div>`}<div><b>${$("#hTime").textContent}</b>Vaqti</div></div>
   <p>Eslab qoling: <b>101</b> yong'in, <b>102</b> militsiya, <b>103</b> tez yordam.</p>
   <div class="row"><button type="button" id="again">↻ Qaytadan</button><button type="button" class="go" id="nextm">${nn} ▶</button></div>`,
   ()=>{$("#again").onclick=()=>{closeCard();setMode(S.mode)};$("#nextm").onclick=()=>{closeCard();setMode(next)}});
  confetti();chime();setTimeout(()=>playSnd(CATS.med.snd),600);
}

/* ===== modes ===== */
function resetStats(){clearInterval(S.timer);S.t0=0;S.timer=null;S.first=0;S.score=0;S.total=0;S.stage=0;S.found=new Set();S.sel=null;S.busy=false;S.fin=false;S.round=0;S.miss=false;$("#hTime").textContent="0:00";say("");clearMinis()}
function setMode(m){S.mode=m;$$("#modes button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.m===m)));stopSfx();stopSpeech();ov.classList.remove("on");stopTimers();onCloseCb=null;resetStats();
  ({explore:renderExplore,sort:renderSort,sound:renderSound,number:renderNumber})[m]()}
$("#modes").addEventListener("click",e=>{const b=e.target.closest("button");if(b){A();setMode(b.dataset.m)}});
$("#bReset").onclick=()=>{A();setMode(S.mode)};
$("#bSound").onclick=()=>{S.soundOn=!S.soundOn;$("#bSound").textContent=S.soundOn?"🔊":"🔇";$("#bSound").setAttribute("aria-pressed",String(S.soundOn));if(!S.soundOn){stopSfx();stopSpeech()}else A()};
$("#bMusic").onclick=()=>{S.musicOn=!S.musicOn;$("#bMusic").setAttribute("aria-pressed",String(S.musicOn));A();music()};
$("#bFull").onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}};

/* 1. Explore */
function renderExplore(){
  prompt_.innerHTML=`<div class="pp"><h2>Rasmni bosing, ovozini eshiting!</h2><p>Har bir narsa o'z ovozi bilan gapiradi</p></div>`;
  tray.className="tray explore";tray.innerHTML="";shuffle(ITEMS).forEach((it,i)=>tray.appendChild(tok(it,i)));
  hud("0/15","Tanishuv");S.total=15;
}
tray.addEventListener("click",e=>{const t=e.target.closest(".tok");if(!t||S.busy)return;const it=byId(t.dataset.id);A();
  if(S.mode==="explore"){begin();S.found.add(it.id);t.classList.add("seen");hud(S.found.size+"/15");
    openCard(it,{label:"Yopish",onClose:()=>{if(S.found.size===15&&!S.fin)finish()}})}
  else if(S.mode==="sound"){answerSound(it,t)}
  else if(S.mode==="sort"&&e.detail===0){selectTok(t)}});
binsEl.addEventListener("click",e=>{const b=e.target.closest(".bin");if(!b||S.busy)return;const k=b.dataset.cat;A();
  if(S.mode==="sort"&&S.sel){dropOn(S.sel,b)}
  else if(S.mode==="number"){answerNumber(k,b)}
  else{playSnd(CATS[k].snd);speak(CATS[k].name+". "+CATS[k].num);if(S.mode==="sort")say("Avval rasmni tanlang yoki sudrab keling")}});

/* 2. Sort: drag to buildings, in 3 stages */
let STAGES=[];
function renderSort(){
  const g={med:[],fire:[],pol:[]};shuffle(ITEMS).forEach(i=>g[i.c].push(i));
  const cut={med:[[0,1],[1,3],[3,5]],fire:[[0,2],[2,3],[3,5]],pol:[[0,2],[2,4],[4,5]]};
  STAGES=[0,1,2].map(s=>shuffle([].concat(...["med","fire","pol"].map(k=>g[k].slice(...cut[k][s])))));S.total=15;loadStage()}
function loadStage(){
  prompt_.innerHTML=`<div class="pp"><h2>Rasmni to'g'ri xizmat binosiga olib boring</h2><p>Sudrab olib boring yoki rasmni bosib, so'ng binoni bosing</p></div>`;
  tray.className="tray";tray.innerHTML="";STAGES[S.stage].forEach((it,i)=>tray.appendChild(tok(it,i)));hud(S.score+"/15",(S.stage+1)+"-bosqich");say("")}
function selectTok(t){if(S.sel)S.sel.classList.remove("sel");if(S.sel===t){S.sel=null;return}S.sel=t;t.classList.add("sel");begin();const it=byId(t.dataset.id);speak(it.n,()=>{if(S.sel===t)playSnd(it.id)})}
function dropOn(t,bin){
  if(S.busy||!t||!bin)return;begin();const it=byId(t.dataset.id),k=bin.dataset.cat;
  if(S.sel){S.sel.classList.remove("sel");S.sel=null}
  if(it.c===k){
    t.classList.add("done");S.score++;if(!t.dataset.miss)S.first++;hud(S.score+"/15");say("To'g'ri! Barakalla!","good");
    bin.querySelector(".mini").insertAdjacentText("beforeend",it.e);bin.classList.remove("pulse");void bin.offsetWidth;bin.classList.add("pulse");chime();
    setTimeout(()=>openCard(it,{onClose:afterDrop}),380);
  }else{
    t.dataset.miss=1;[t,bin].forEach(x=>{x.classList.remove("shake");void x.offsetWidth;x.classList.add("shake")});say("Bu yerga mos kelmaydi. Yana urinib ko'ring!","bad");buzz()}
}
function afterDrop(){if($$(".tok:not(.done)",tray).length)return;
  if(S.stage<2){const n=S.stage+1;showPanel(`<div class="stage fire" style="height:clamp(100px,18vh,200px)"><span class="em a-bounce">🌟</span></div><h2>${n}-bosqich tugadi!</h2><div class="stars3">${"⭐".repeat(n)}</div><p>Yana ${3-n} ta bosqich qoldi. Davom etamizmi?</p><div class="row"><button type="button" class="go" id="nx">${n+1}-bosqich ▶</button></div>`,
    ()=>{$("#nx").onclick=()=>{S.stage=n;S.busy=false;ov.classList.remove("on");loadStage()}});chime();confetti()}
  else finish()}
/* drag */
let drag=null;
tray.addEventListener("pointerdown",e=>{if(S.mode!=="sort"||S.busy)return;const t=e.target.closest(".tok");if(!t||t.classList.contains("done"))return;A();drag={t,x:e.clientX,y:e.clientY,moved:false,g:null}});
window.addEventListener("pointermove",e=>{if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.moved=true;drag.g=document.createElement("div");drag.g.className="ghost";drag.g.textContent=byId(drag.t.dataset.id).e;document.body.appendChild(drag.g);drag.t.style.opacity=.3}
  if(drag.moved){drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";$$(".bin").forEach(b=>b.classList.remove("over"));const b=binAt(e.clientX,e.clientY);if(b)b.classList.add("over")}});
const binAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(".bin"):null};
window.addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;$$(".bin").forEach(b=>b.classList.remove("over"));
  if(d.moved){d.g.remove();d.t.style.opacity="";const b=binAt(e.clientX,e.clientY);if(b)dropOn(d.t,b)}else selectTok(d.t)});
window.addEventListener("pointercancel",()=>{if(drag){if(drag.g)drag.g.remove();drag.t.style.opacity="";drag=null}});

/* 3. Guess the sound */
function renderSound(){S.order=shuffle(ITEMS).slice(0,10);S.total=10;S.round=0;nextSound()}
function nextSound(){
  if(S.round>=S.total){finish();return}
  const it=S.order[S.round];S.cur=it;S.miss=false;
  const opts=shuffle([it,...shuffle(ITEMS.filter(x=>x.id!==it.id)).slice(0,3)]);
  prompt_.innerHTML=`<div class="pp"><h2>Bu qaysi narsaning ovozi?</h2><p>${S.round+1}-savol, jami ${S.total} ta</p></div><button type="button" class="ask" id="ask">🔊 Ovozni eshitish</button>`;
  $("#ask").onclick=()=>{A();playSnd(it.id)};
  tray.className="tray";tray.innerHTML="";opts.forEach((o,i)=>tray.appendChild(tok(o,i)));hud(S.first+"/"+S.total,"Savol "+(S.round+1));say("");
  ctimers.push(setTimeout(()=>{if(S.mode==="sound"&&!S.busy)playSnd(it.id)},600));
}
function answerSound(it,t){begin();
  if(it.id===S.cur.id){if(!S.miss)S.first++;hud(S.first+"/"+S.total);t.classList.add("right");say("To'g'ri! Bu "+it.n.toLowerCase()+"!","good");chime();S.round++;
    setTimeout(()=>openCard(it,{quiet:false,onClose:nextSound}),500)}
  else{S.miss=true;t.classList.remove("shake");void t.offsetWidth;t.classList.add("shake");buzz();say("Yana eshiting va urinib ko'ring!","bad");setTimeout(()=>playSnd(S.cur.id),700)}}

/* 4. Which number to call */
function renderNumber(){S.order=shuffle(SCEN).slice(0,8);S.total=8;S.round=0;nextNumber()}
function nextNumber(){
  if(S.round>=S.total){finish();return}
  const s=S.order[S.round];S.cur=s;S.miss=false;tray.className="tray";tray.innerHTML="";
  prompt_.innerHTML=`<div class="pp"><h2>Qaysi raqamga qo'ng'iroq qilamiz?</h2><p>${S.round+1}-holat, jami ${S.total} ta</p></div><div class="scn"><span class="big">${s.e}</span><span class="tx">${s.t}</span></div>`;
  hud(S.first+"/"+S.total,"Holat "+(S.round+1));say("Tegishli xizmat binosini bosing");speak(s.t);}
function answerNumber(k,bin){begin();const s=S.cur;
  if(k===s.c){if(!S.miss)S.first++;hud(S.first+"/"+S.total);bin.classList.remove("pulse");void bin.offsetWidth;bin.classList.add("pulse");chime();S.round++;
    const c=CATS[k];setTimeout(()=>openCard({id:c.snd,e:s.e,n:"📞 "+c.num+" · "+c.short,c:k,anim:k==="fire"||k==="med"||k==="pol"?"drive":"bounce",say:"To'g'ri! "+c.num+" ga qo'ng'iroq!",t:s.why},{onClose:nextNumber}),380)}
  else{S.miss=true;bin.classList.remove("shake");void bin.offsetWidth;bin.classList.add("shake");buzz();say("Yo'q, yana o'ylab ko'ring!","bad")}}

setMode("explore");
</script>
</body>
</html>
